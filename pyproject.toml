[project]
name = "data-agent"
version = "0.1.0"
description = "可信 NL2SQL 问数系统：问题 -> 语义层防线 -> 只读执行 -> 带痕迹的结果"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
data-agent = "data_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
