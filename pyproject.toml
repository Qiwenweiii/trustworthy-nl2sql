[project]
name = "data-agent"
version = "0.1.0"
description = "v0 data agent: question -> SQL -> guarded read-only execution -> result"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
data-agent = "data_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
